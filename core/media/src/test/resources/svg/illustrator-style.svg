<?xml version="1.0" encoding="utf-8"?>
<!-- The shape of a file exported from a desktop drawing program: entities for namespaces, private metadata, and a switch. Written for
     these tests. -->
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd" [
  <!ENTITY ns_svg "http://www.w3.org/2000/svg">
  <!ENTITY ns_xlink "http://www.w3.org/1999/xlink">
  <!ENTITY ns_ai "http://ns.adobe.com/AdobeIllustrator/10.0/">
  <!ENTITY ns_extend "http://ns.adobe.com/Extensibility/1.0/">
]>
<svg version="1.1" xmlns="&ns_svg;" xmlns:xlink="&ns_xlink;" xmlns:i="&ns_ai;" xmlns:x="&ns_extend;"
     x="0px" y="0px" width="100px" height="100px" viewBox="0 0 100 100" xml:space="preserve">
  <switch>
    <foreignObject requiredExtensions="&ns_ai;" x="0" y="0" width="1" height="1">
      <i:pgfRef xlink:href="#adobe_private_data"/>
    </foreignObject>
    <g i:extraneous="self">
      <style type="text/css">
        .st0 { fill: #FF0000; }
        .st1 { fill: none; stroke: #000000; stroke-miterlimit: 10; }
      </style>
      <rect x="0" y="0" class="st0" width="100" height="100"/>
      <path class="st1" d="M10,10l80,0"/>
    </g>
  </switch>
  <i:pgf id="adobe_private_data">
    <![CDATA[ a great deal of private binary data would be here ]]>
  </i:pgf>
</svg>
