<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <!-- What a frozen value is, when the last repeat was cut short or ended exactly. -->
  <rect x="10" y="10" width="20" height="20" fill="#cc3333"><animate attributeName="x" values="10;170;90" dur="2s" repeatCount="1.5" fill="freeze"/></rect>
  <rect x="10" y="40" width="20" height="20" fill="#3366cc"><animate attributeName="x" values="10;170;90" dur="2s" repeatCount="2" fill="freeze"/></rect>
  <rect x="10" y="70" width="20" height="20" fill="#33aa33"><animate attributeName="x" values="10;170;90" dur="2s" repeatDur="3s" fill="freeze"/></rect>
  <rect x="10" y="100" width="20" height="20" fill="#cc9900"><animate attributeName="x" values="10;170;90" dur="2s" end="3s" fill="freeze"/></rect>
  <rect x="10" y="130" width="20" height="20" fill="#990099"><animate attributeName="x" values="10;170;90" dur="2s" repeatCount="indefinite" end="3s" fill="freeze"/></rect>
  <rect x="10" y="160" width="20" height="20" fill="#00aaaa"><animate attributeName="x" from="10" to="170" dur="2s" end="1s;4s" fill="freeze" begin="0s;3s"/></rect>
</svg>
