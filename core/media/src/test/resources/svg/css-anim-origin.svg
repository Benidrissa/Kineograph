<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <style>
    @keyframes sp { from { transform: rotate(0deg) } to { transform: rotate(180deg) } }
    rect, g { animation: sp 2s linear forwards }
    .fb { transform-box: fill-box; transform-origin: center }
    .fb0 { transform-box: fill-box; transform-origin: 0 0 }
    .fbp { transform-box: fill-box; transform-origin: 100% 100% }
    .fb25 { transform-box: fill-box; transform-origin: 25% 75% }
    .vb { transform-box: view-box; transform-origin: 50% 50% }
    .sb { transform-box: stroke-box; transform-origin: 0 0 }
    .dflt { transform-origin: 30px 170px }
    .gr { transform-box: fill-box; transform-origin: 50% 50% }
  </style>
  <rect class="fb" x="10" y="10" width="40" height="20" fill="#cc3333"/>
  <rect class="fb0" x="80" y="10" width="40" height="20" fill="#3366cc"/>
  <rect class="fbp" x="150" y="20" width="30" height="20" fill="#33aa33"/>
  <rect class="fb25" x="20" y="60" width="40" height="20" fill="#cc9900"/>
  <rect class="vb" x="90" y="60" width="40" height="20" fill="#990099"/>
  <rect class="sb" x="150" y="60" width="30" height="20" fill="#00aaaa" stroke="#000000" stroke-width="6"/>
  <rect class="dflt" x="10" y="160" width="40" height="20" fill="#555555"/>
  <g class="gr"><rect x="90" y="150" width="20" height="20" fill="#ff6600"/><rect x="130" y="170" width="20" height="20" fill="#0066ff"/></g>
</svg>
