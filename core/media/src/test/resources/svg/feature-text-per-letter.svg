<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <!-- A turn for each letter, and a stretch to a given length, are skipped with a warning. -->
  <g font-size="20" font-family="sans-serif">
    <text x="10" y="40" rotate="10 20 30 40">Turn</text>
    <text x="10" y="80" textLength="150">Spaced out</text>
    <text x="10" y="120" textLength="150" lengthAdjust="spacingAndGlyphs">Stretched</text>
  </g>
</svg>
