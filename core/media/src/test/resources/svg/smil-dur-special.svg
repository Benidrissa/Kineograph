<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <!-- These never tween: a set-like hold at the first value, or no effect at all. -->
  <rect x="10" y="10" width="20" height="20" fill="#cc3333"><animate attributeName="x" from="100" to="170" dur="indefinite"/></rect>
  <rect x="10" y="40" width="20" height="20" fill="#3366cc"><animate attributeName="x" from="100" to="170"/></rect>
  <rect x="10" y="70" width="20" height="20" fill="#33aa33"><animate attributeName="x" from="100" to="170" dur="0s"/></rect>
  <rect x="10" y="100" width="20" height="20" fill="#cc9900"><animate attributeName="x" from="100" to="170" dur="-1s"/></rect>
  <rect x="10" y="130" width="20" height="20" fill="#990099"><animate attributeName="x" from="100" to="170" dur="soon"/></rect>
  <rect x="10" y="160" width="20" height="20" fill="#00aaaa"><animate attributeName="x" from="100" to="170" dur="2" fill="freeze"/></rect>
  <rect x="40" y="185" width="20" height="10" fill="#555555"><animate attributeName="x" from="100" to="170" dur="2s" repeatCount="-1"/></rect>
</svg>
