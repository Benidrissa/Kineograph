<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <rect id="t1" x="10" y="10" width="30" height="30" fill="#cc3333"/>
  <rect id="t2" x="10" y="50" width="30" height="30" fill="#3366cc"/>
  <!-- An animation can sit anywhere and name its target. -->
  <animate href="#t1" attributeName="x" from="10" to="160" dur="2s" fill="freeze"/>
  <animate xlink:href="#t2" attributeName="x" from="10" to="160" dur="2s" fill="freeze"/>
  <defs><animate href="#t3" attributeName="x" from="10" to="160" dur="2s" fill="freeze"/></defs>
  <rect id="t3" x="10" y="90" width="30" height="30" fill="#33aa33"/>
  <!-- Missing target: no effect. The parent is not used instead. -->
  <rect x="10" y="130" width="30" height="30" fill="#cc9900"><animate href="#absent" attributeName="x" from="10" to="160" dur="2s" fill="freeze"/></rect>
  <rect x="10" y="165" width="30" height="30" fill="#990099"><animate attributeName="nonsense" from="10" to="160" dur="2s" fill="freeze"/></rect>
  <g><animate attributeName="x" from="100" to="160" dur="2s" fill="freeze"/><rect x="60" y="165" width="30" height="30" fill="#00aaaa"/></g>
  <rect x="110" y="165" width="30" height="30" fill="#555555"><animate attributeName="x" attributeType="XML" from="110" to="160" dur="2s" fill="freeze"/><animate attributeName="fill" attributeType="CSS" to="#ffff00" dur="2s" fill="freeze"/></rect>
</svg>
