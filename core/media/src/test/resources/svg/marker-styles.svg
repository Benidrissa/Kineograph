<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <!-- A marker takes its styles from where it is defined, not from the path. -->
    <g fill="#3366cc"><marker id="own" markerWidth="10" markerHeight="10" refX="5" refY="5"><circle cx="5" cy="5" r="4" stroke="#000000" stroke-width="1"/></marker></g>
    <marker id="op" markerWidth="10" markerHeight="10" refX="5" refY="5" opacity=".5"><rect width="10" height="10"/></marker>
    <marker id="trans" markerWidth="10" markerHeight="10" refX="5" refY="5"><circle cx="5" cy="5" r="4" fill="context-stroke"/></marker>
  </defs>
  <g fill="#cc3333" stroke="#33aa33" stroke-width="2">
    <path d="M15 30 H85" fill="none" marker-end="url(#own)" marker-start="url(#own)"/>
    <path d="M115 30 H185" marker-end="url(#op)" opacity=".5"/>
    <path d="M15 80 H85" marker-end="url(#trans)"/>
  </g>
</svg>
