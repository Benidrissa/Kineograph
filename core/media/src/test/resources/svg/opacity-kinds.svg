<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <rect x="0" y="0" width="200" height="200" fill="#dddddd"/>
  <g stroke-width="12">
    <!-- opacity fades fill and stroke together as one picture; fill-opacity and stroke-opacity let them show through each other. -->
    <circle cx="50" cy="50" r="35" fill="#ff0000" stroke="#0000ff" opacity="0.5"/>
    <circle cx="150" cy="50" r="35" fill="#ff0000" stroke="#0000ff" fill-opacity="0.5" stroke-opacity="0.5"/>
    <g opacity="0.5"><g opacity="0.5"><circle cx="50" cy="150" r="35" fill="#ff0000" stroke="#0000ff"/></g></g>
    <g fill-opacity="0.25"><circle cx="150" cy="150" r="35" fill="#ff0000" stroke="#0000ff" stroke-opacity="0.75"/></g>
  </g>
  <rect x="85" y="85" width="30" height="30" fill="#000000" style="opacity: 50%"/>
  <rect x="0" y="85" width="30" height="30" fill="#000000" opacity="1.5"/>
  <rect x="170" y="85" width="30" height="30" fill="#000000" opacity="-1"/>
</svg>
