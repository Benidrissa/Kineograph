<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="a"><stop offset="0" stop-color="#ffff00"/><stop offset="1" stop-color="#cc0000"/></radialGradient>
    <radialGradient id="b" cx=".25" cy=".75" r=".5"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#00aa00"/><stop offset="1" stop-color="#000000"/></radialGradient>
    <radialGradient id="c" cx="50%" cy="50%" r="25%"><stop offset="0%" stop-color="#00ffff"/><stop offset="100%" stop-color="#0000ff"/></radialGradient>
  </defs>
  <circle cx="50" cy="50" r="40" fill="url(#a)"/>
  <!-- Wider than tall: the gradient's circles become ellipses. -->
  <rect x="100" y="10" width="90" height="40" fill="url(#a)"/>
  <rect x="100" y="60" width="40" height="90" fill="url(#a)"/>
  <rect x="10" y="100" width="80" height="80" fill="url(#b)"/>
  <ellipse cx="160" cy="150" rx="35" ry="45" fill="url(#c)"/>
</svg>
