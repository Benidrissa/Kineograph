<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <!-- In a stylesheet a length needs a unit, unless it is zero, or a stroke's. Presentation attributes do not need them. -->
  <style>
    .a { x: 50; y: 10px; width: 30px; height: 30px; fill: #cc3333 }
    .b { font-size: 40; x: 110px; y: 10px; width: 2em; height: 30px; fill: #3366cc }
    .c { r: 20; fill: #33aa33 }
    .d { stroke: #000000; stroke-width: 6; stroke-dasharray: 10 4; stroke-dashoffset: 3; fill: none }
    .e { transform-origin: 30 170; transform: rotate(20deg); fill: #cc9900 }
    .f { letter-spacing: 4; font-size: 16px; font-family: sans-serif; fill: #990099 }
    .g { x: 0; y: 100px; width: 40px; height: 20px; fill: #00aaaa }
  </style>
  <rect class="a" x="10" width="20" height="20"/>
  <rect class="b" width="20" height="20" font-size="10"/>
  <circle class="c" cx="170" cy="30" r="10"/>
  <rect class="d" x="110" y="60" width="60" height="30"/>
  <rect class="e" x="10" y="160" width="40" height="20"/>
  <text class="f" x="10" y="80">spaced</text>
  <rect class="g" x="20" y="10"/>
</svg>
