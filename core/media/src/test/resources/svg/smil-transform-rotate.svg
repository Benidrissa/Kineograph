<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <g transform="translate(50 50)"><rect x="0" y="-5" width="40" height="10" fill="#cc3333"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/></rect></g>
  <!-- With a centre that the shape is not at the origin of. -->
  <rect x="140" y="20" width="40" height="10" fill="#3366cc"><animateTransform attributeName="transform" type="rotate" from="0 150 50" to="360 150 50" dur="4s" repeatCount="indefinite"/></rect>
  <rect x="30" y="130" width="50" height="20" fill="#33aa33"><animateTransform attributeName="transform" type="rotate" values="0 55 140;90 55 140;0 55 140" dur="2s" repeatCount="indefinite"/></rect>
  <!-- Centre moves too. -->
  <rect x="130" y="130" width="40" height="10" fill="#cc9900"><animateTransform attributeName="transform" type="rotate" from="0 130 130" to="180 170 170" dur="4s" fill="freeze"/></rect>
</svg>
