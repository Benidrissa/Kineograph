<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <text x="10" y="30" font-size="20" font-family="sans-serif" fill="#cc3333">Move<animate attributeName="x" from="10" to="100" dur="2s" fill="freeze"/></text>
  <text x="10" y="60" font-size="10" font-family="sans-serif" fill="#3366cc">Grow<animate attributeName="font-size" from="10" to="30" dur="2s" fill="freeze"/></text>
  <text x="10" y="100" font-size="20" font-family="sans-serif">Co<tspan fill="#000000">lour<animate attributeName="fill" from="#000000" to="#00ff00" dur="2s" fill="freeze"/></tspan></text>
  <text x="10" y="130" font-size="20" font-family="sans-serif" letter-spacing="0">Wide<animate attributeName="letter-spacing" from="0" to="10" dur="2s" fill="freeze"/></text>
  <text x="10" y="170" font-size="20" font-family="sans-serif" fill="#990099">A<tspan dy="0">B<animate attributeName="dy" from="0" to="20" dur="2s" fill="freeze"/></tspan>C</text>
  <text x="100" y="170" font-size="20" font-family="sans-serif" fill="#00aaaa" stroke="#000000" stroke-width="0">Line<animate attributeName="stroke-width" from="0" to="2" dur="2s" fill="freeze"/></text>
</svg>
