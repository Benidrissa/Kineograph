<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="g"><stop offset="0" stop-color="#ff0000"/><stop offset="1" stop-color="#0000ff"/></linearGradient>
    <radialGradient id="r"><stop offset="0" stop-color="#ffff00"/><stop offset="1" stop-color="#008800"/></radialGradient>
  </defs>
  <!-- Strokes use the fill box, with no room for the stroke's own width. -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="url(#g)" stroke-width="14"/>
  <rect x="110" y="20" width="70" height="60" fill="url(#r)" stroke="url(#g)" stroke-width="6"/>
  <!-- Inherited: each child uses its own box. -->
  <g fill="url(#g)">
    <rect x="10" y="100" width="40" height="25"/>
    <rect x="60" y="100" width="40" height="25"/>
    <rect x="110" y="100" width="80" height="25"/>
  </g>
  <!-- A flat box has nothing to measure against, so the paint is not used. -->
  <line x1="10" y1="140" x2="190" y2="140" stroke="url(#g)" stroke-width="6"/>
  <line x1="10" y1="150" x2="190" y2="150" stroke="url(#g) #33aa33" stroke-width="6"/>
  <path d="M10 160 H190" stroke="url(#g)" stroke-width="6"/>
  <!-- Opacity multiplies with the stops. -->
  <rect x="10" y="170" width="85" height="25" fill="url(#g)" fill-opacity=".5"/>
  <rect x="105" y="170" width="85" height="25" fill="url(#g)" opacity=".5"/>
  <!-- The box is measured before the transform. -->
  <rect x="0" y="0" width="30" height="5" fill="url(#g)" transform="translate(150 165) rotate(180)"/>
</svg>
