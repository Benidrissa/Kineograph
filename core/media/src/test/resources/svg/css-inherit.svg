<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <style>
    g.top { fill: #cc3333; stroke: #000000; stroke-width: 3; font-size: 20px; opacity: 1 }
    .i-w { stroke-width: inherit }
    .i-op { opacity: inherit }
  </style>
  <g class="top">
    <rect x="5" y="5" width="30" height="30"/>
    <g fill="#3366cc"><rect x="45" y="5" width="30" height="30"/></g>
    <rect x="85" y="5" width="30" height="30" style="fill: #33aa33"/>
    <!-- em lengths resolve with the font size set on the same element. -->
    <rect x="125" y="5" width="2em" height="30" font-size="15"/>
    <!-- opacity does not inherit, but can be asked to. -->
    <g opacity=".5"><rect x="5" y="45" width="30" height="30"/><rect x="45" y="45" width="30" height="30" class="i-op"/></g>
    <g style="stroke-width: 10"><rect x="85" y="45" width="30" height="30" class="i-w"/><rect x="125" y="45" width="30" height="30" stroke-width="1"/></g>
    <!-- Relative font sizes multiply. -->
    <g font-size="10"><g font-size="2em"><rect x="5" y="85" width="2em" height="1em"/><g style="font-size: 50%"><rect x="60" y="85" width="2em" height="1em"/></g></g></g>
    <g font-size="larger"><rect x="100" y="85" width="2em" height="1em"/></g>
    <g font-size="small"><rect x="150" y="85" width="2em" height="1em"/></g>
  </g>
</svg>
