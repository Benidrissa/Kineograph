<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <style>
    .sun { fill: #ffcc33; animation: glow 2s ease-in-out infinite alternate }
    .ray { stroke: #ffcc33; stroke-width: 4; transform-origin: 40px 40px; animation: turn 4s linear infinite }
    @keyframes glow { from { fill: #ffcc33 } to { fill: #ff8800 } }
    @keyframes turn { to { transform: rotate(360deg) } }
  </style>
  <rect width="200" height="200" fill="#ccf0ff"/>
  <rect y="150" width="200" height="50" fill="#669933"/>
  <circle class="sun" cx="40" cy="40" r="15"/>
  <g class="ray"><line x1="40" y1="10" x2="40" y2="20"/><line x1="40" y1="60" x2="40" y2="70"/><line x1="10" y1="40" x2="20" y2="40"/><line x1="60" y1="40" x2="70" y2="40"/></g>
  <g>
    <animateMotion path="M10 140 H170" dur="2s" repeatCount="indefinite"/>
    <circle r="8" cy="-20" fill="#cc3333"/>
    <rect x="-3" y="-12" width="6" height="12" fill="#3366cc"/>
    <line x1="0" y1="0" x2="-6" y2="10" stroke="#000000" stroke-width="3"><animate attributeName="x2" values="-6;6;-6" dur=".5s" repeatCount="indefinite"/></line>
    <line x1="0" y1="0" x2="6" y2="10" stroke="#000000" stroke-width="3"><animate attributeName="x2" values="6;-6;6" dur=".5s" repeatCount="indefinite"/></line>
  </g>
</svg>
