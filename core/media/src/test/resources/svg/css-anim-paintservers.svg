<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <style>
    @keyframes sc { from { stop-color: #ff0000 } to { stop-color: #00ff00 } }
    @keyframes so { from { stop-opacity: 1 } to { stop-opacity: 0 } }
    @keyframes cl { from { transform: translateX(0) } to { transform: translateX(50px) } }
    @keyframes pt { from { fill: #000000 } to { fill: #ffffff } }
    @keyframes mk { from { fill: #ff0000 } to { fill: #0000ff } }
    .sc { animation: sc 2s linear forwards }
    .so { animation: so 2s linear forwards }
    .cl { animation: cl 2s linear forwards }
    .pt { animation: pt 2s linear forwards }
    .mk { animation: mk 2s linear forwards }
  </style>
  <defs>
    <linearGradient id="g"><stop class="sc" offset="0" stop-color="#000000"/><stop class="so" offset="1" stop-color="#0000ff"/></linearGradient>
    <clipPath id="c"><rect class="cl" x="10" y="60" width="30" height="30"/></clipPath>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><rect class="pt" x="110" y="60" width="80" height="30"/></mask>
    <pattern id="p" patternUnits="userSpaceOnUse" width="20" height="20"><rect class="pt" width="10" height="10"/></pattern>
    <marker id="k" markerWidth="10" markerHeight="10" refX="5" refY="5"><circle class="mk" cx="5" cy="5" r="4"/></marker>
  </defs>
  <rect x="10" y="10" width="180" height="30" fill="url(#g)"/>
  <rect x="0" y="50" width="100" height="50" fill="#33aa33" clip-path="url(#c)"/>
  <rect x="100" y="50" width="100" height="50" fill="#cc9900" mask="url(#m)"/>
  <rect x="10" y="110" width="80" height="80" fill="url(#p)" stroke="#000000"/>
  <path d="M110 150 H180" stroke="#000000" stroke-width="2" marker-end="url(#k)" marker-start="url(#k)"/>
</svg>
