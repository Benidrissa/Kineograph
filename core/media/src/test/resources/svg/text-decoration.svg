<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <g font-size="20" font-family="sans-serif">
    <text x="10" y="30" text-decoration="underline" fill="#cc3333">Under</text>
    <text x="110" y="30" text-decoration="overline" fill="#3366cc">Over</text>
    <text x="10" y="70" text-decoration="line-through" fill="#33aa33">Through</text>
    <text x="110" y="70" style="text-decoration: underline line-through" fill="#cc9900">Both</text>
    <!-- The line takes the paint of the element that asked for it, and runs across what is inside. -->
    <text x="10" y="110" text-decoration="underline" fill="#990099">ab<tspan fill="#00aaaa">cd</tspan>ef</text>
    <text x="110" y="110">gh<tspan text-decoration="underline" fill="#ff6600">ij</tspan>kl</text>
    <text x="10" y="150" font-size="40" text-decoration="underline" fill="#555555">Bit</text>
    <text x="110" y="150" text-decoration="underline" fill="none" stroke="#000000">Line</text>
    <text x="10" y="190" font-size="10" text-decoration="underline line-through overline">small text</text>
  </g>
</svg>
