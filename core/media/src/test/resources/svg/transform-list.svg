<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <g fill="#cc3333">
    <rect x="0" y="0" width="30" height="20" transform="translate(10 10)"/>
    <rect x="0" y="0" width="30" height="20" transform="translate(50)" fill="#3366cc"/>
    <rect x="0" y="0" width="30" height="20" transform="translate(100 10) scale(2 .5)" fill="#33aa33"/>
    <rect x="0" y="0" width="20" height="10" transform="translate(170,10)scale(1.25)" fill="#cc9900"/>
    <rect x="0" y="0" width="30" height="20" transform="translate(30 60) rotate(30)" fill="#990099"/>
    <rect x="70" y="50" width="30" height="20" transform="rotate(30 85 60)" fill="#00aaaa"/>
    <rect x="120" y="50" width="30" height="20" transform="rotate(-45,135,60)" fill="#aa5500"/>
    <rect x="0" y="0" width="30" height="20" transform="translate(10 110) skewX(30)" fill="#555555"/>
    <rect x="0" y="0" width="30" height="20" transform="translate(70 100) skewY(30)" fill="#ff6600"/>
    <rect x="0" y="0" width="30" height="20" transform="matrix(1 .3 -.3 1 120 100)" fill="#0066ff"/>
    <rect x="0" y="0" width="30" height="20" transform="matrix(.5,0,0,2,170,100)" fill="#66cc00"/>
    <!-- Comma and space variants, and order mattering. -->
    <rect x="0" y="0" width="20" height="20" transform=" translate( 10 , 150 ) , scale( 1.5 ) " fill="#ff00ff"/>
    <rect x="0" y="0" width="20" height="20" transform="rotate(45) translate(100 50)" fill="#00ff00"/>
    <rect x="0" y="0" width="20" height="20" transform="translate(130 150) rotate(45)" fill="#0000ff"/>
    <!-- A broken list means no transform at all. -->
    <rect x="165" y="150" width="20" height="20" transform="translate(10 10) nonsense(1)" fill="#000000"/>
    <!-- A scale of zero collapses the element. -->
    <rect x="0" y="0" width="200" height="200" transform="scale(0)" fill="#000000"/>
  </g>
</svg>
