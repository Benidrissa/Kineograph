<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="-50 -100 100 100">
  <!-- The origin is in the middle at the bottom. -->
  <rect x="-50" y="-100" width="100" height="100" fill="#eeeeee"/>
  <rect x="-10" y="-10" width="20" height="10" fill="#cc3333"/>
  <circle cx="0" cy="-50" r="20" fill="#3366cc"/>
  <rect x="25%" y="-50%" width="10%" height="10%" fill="#33aa33"/>
  <line x1="-50" y1="-100" x2="50" y2="0" stroke="#000000" stroke-width="1"/>
</svg>
