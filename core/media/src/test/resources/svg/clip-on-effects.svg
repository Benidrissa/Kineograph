<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <clipPath id="c"><circle cx="50" cy="50" r="40"/></clipPath>
    <mask id="m"><rect width="200" height="200" fill="#808080"/></mask>
  </defs>
  <!-- The clip and the opacity both reach the stroke, which is outside the box. -->
  <rect x="20" y="20" width="60" height="60" fill="#cc3333" stroke="#000000" stroke-width="20" clip-path="url(#c)" opacity=".5"/>
  <g transform="translate(100 0)"><rect width="100" height="100" fill="#3366cc" clip-path="url(#c)" mask="url(#m)"/></g>
  <g transform="translate(0 100)" clip-path="url(#c)"><g opacity=".5"><rect width="60" height="100" fill="#33aa33"/><rect x="30" width="70" height="100" fill="#cc9900"/></g></g>
  <!-- The clip is in the element's own user space, including its transform. -->
  <rect width="100" height="100" fill="#990099" clip-path="url(#c)" transform="translate(100 100) scale(.8)"/>
</svg>
