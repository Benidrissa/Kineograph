<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <!-- Whether a second begin interrupts the one playing. -->
  <rect x="10" y="10" width="20" height="20" fill="#cc3333"><animate attributeName="x" from="10" to="170" dur="2s" begin="0s;1s" restart="always"/></rect>
  <rect x="10" y="40" width="20" height="20" fill="#3366cc"><animate attributeName="x" from="10" to="170" dur="2s" begin="0s;1s" restart="whenNotActive"/></rect>
  <rect x="10" y="70" width="20" height="20" fill="#33aa33"><animate attributeName="x" from="10" to="170" dur="2s" begin="0s;1s" restart="never"/></rect>
  <rect x="10" y="100" width="20" height="20" fill="#cc9900"><animate attributeName="x" from="10" to="170" dur="1s" begin="0s;2s" restart="never" fill="freeze"/></rect>
  <rect x="10" y="130" width="20" height="20" fill="#990099"><animate attributeName="x" from="10" to="170" dur="1s" begin="0s;2s" restart="whenNotActive"/></rect>
</svg>
