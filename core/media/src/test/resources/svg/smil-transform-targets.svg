<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="g"><animateTransform attributeName="gradientTransform" type="translate" from="0" to=".5" dur="2s" fill="freeze"/><stop offset="0" stop-color="#ff0000"/><stop offset="1" stop-color="#0000ff"/></linearGradient>
    <pattern id="p" patternUnits="userSpaceOnUse" width="20" height="20"><animateTransform attributeName="patternTransform" type="rotate" from="0" to="45" dur="2s" fill="freeze"/><rect width="10" height="20" fill="#33aa33"/></pattern>
    <clipPath id="c"><rect x="10" y="110" width="30" height="30"><animateTransform attributeName="transform" type="translate" from="0" to="40" dur="2s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><animateTransform attributeName="transform" type="scale" from="1" to="1.5" dur="2s" fill="freeze"/><circle cx="130" cy="130" r="20"/></clipPath>
  </defs>
  <rect x="10" y="10" width="80" height="80" fill="url(#g)"/>
  <rect x="110" y="10" width="80" height="80" fill="url(#p)"/>
  <rect x="0" y="100" width="100" height="100" fill="#cc9900" clip-path="url(#c)"/>
  <rect x="100" y="100" width="100" height="100" fill="#990099" clip-path="url(#c2)"/>
</svg>
