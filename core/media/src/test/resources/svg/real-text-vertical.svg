<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" font-family="sans-serif" font-size="16">
  <text x="20" y="10" writing-mode="tb">Vertical</text>
  <text x="60" y="10" style="writing-mode:vertical-rl">Sideways</text>
  <text x="100" y="10" style="writing-mode:vertical-rl;text-orientation:upright">Up</text>
  <text x="140" y="190" writing-mode="tb" text-anchor="end">To end</text>
  <text x="180" y="100" writing-mode="tb" text-anchor="middle">Middle</text>
</svg>
