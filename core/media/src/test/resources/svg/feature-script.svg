<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <!-- The picture a script would change. Scripts never run here, so this is the file as written. -->
  <script>document.getElementById('box').setAttribute('fill', '#00ff00')</script>
  <script type="text/ecmascript"><![CDATA[ for (;;) { } ]]></script>
  <rect id="box" x="10" y="10" width="80" height="80" fill="#cc3333" onclick="alert(1)" onload="this.remove()"/>
