  <a><circle cx="50" cy="150" r="40" fill="#33aa33"/></a>
  <switch><rect x="110" y="110" width="80" height="80" fill="#cc9900" systemLanguage="xx-none"/><rect x="110" y="110" width="80" height="80" fill="#990099"/><rect x="110" y="110" width="80" height="80" fill="#000000"/></switch>
