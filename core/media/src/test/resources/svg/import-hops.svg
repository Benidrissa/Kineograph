<?xml version="1.0" encoding="UTF-8"?>
<!-- A red square that hops right every half second, then is gone for the last half second. Written for these tests. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <rect x="0" y="0" width="20" height="20" fill="#ff0000">
    <animate attributeName="x" values="0;20;40;60" calcMode="discrete" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="display" values="inline;inline;inline;none" calcMode="discrete" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
