<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <clipPath id="circle"><circle cx="50" cy="50" r="40"/></clipPath>
    <clipPath id="two"><rect x="110" y="10" width="30" height="80"/><circle cx="160" cy="50" r="30"/></clipPath>
    <clipPath id="empty"/>
  </defs>
  <rect x="0" y="0" width="100" height="100" fill="#cc3333" clip-path="url(#circle)"/>
  <!-- Several children add up. -->
  <rect x="100" y="0" width="100" height="100" fill="#3366cc" clip-path="url(#two)"/>
  <!-- A clip with no children hides everything, a missing one clips nothing. -->
  <rect x="0" y="110" width="60" height="30" fill="#000000" clip-path="url(#empty)"/>
  <rect x="0" y="110" width="60" height="30" fill="#33aa33" clip-path="url(#missing)"/>
  <!-- The clip ignores paint, stroke and opacity of its children. -->
  <clipPath id="plain"><rect x="110" y="110" width="60" height="60" fill="none" stroke="#ff0000" stroke-width="30" opacity="0.1"/></clipPath>
  <rect x="80" y="100" width="120" height="100" fill="#cc9900" clip-path="url(#plain)"/>
  <g clip-path="url(#circle)" transform="translate(0 110)"><rect x="0" y="0" width="50" height="90" fill="#990099"/><rect x="50" y="0" width="50" height="90" fill="#00aaaa"/></g>
</svg>
