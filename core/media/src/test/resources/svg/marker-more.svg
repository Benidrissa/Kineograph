<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <marker id="d" markerWidth="8" markerHeight="8" refX="4" refY="4"><circle cx="4" cy="4" r="3" fill="#cc3333"/></marker>
    <marker id="t" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#3366cc"/></marker>
    <marker id="css" markerWidth="8" markerHeight="8" refX="4" refY="4" style="overflow: visible"><circle cx="4" cy="4" r="6" fill="#33aa33"/></marker>
  </defs>
  <style>.m { marker-start: url(#d); marker-end: url(#t) }</style>
  <g fill="none" stroke="#000000" stroke-width="2">
    <!-- Several parts, each with its own start and end. -->
    <path d="M15 20 H60 M90 20 H135 L150 40" marker-start="url(#d)" marker-mid="url(#t)" marker-end="url(#d)"/>
    <!-- Doubling back, and a point visited twice. -->
    <path d="M15 60 H60 H30" marker-mid="url(#t)"/>
    <path d="M90 60 H135 V90 H90 Z" marker-start="url(#t)" marker-mid="url(#d)" marker-end="url(#t)"/>
    <!-- Arcs and curves that end at a vertex. -->
    <path d="M15 120 A30 30 0 0 1 75 120 C75 140 95 140 95 120" marker-start="url(#t)" marker-mid="url(#t)" marker-end="url(#t)"/>
    <path class="m" d="M110 120 Q150 90 190 120"/>
    <path d="M15 160 Q45 130 75 160 T135 160" marker-mid="url(#css)"/>
    <!-- A line with no length has a direction of zero. -->
    <path d="M150 160 L150 160" marker-end="url(#t)" marker-start="url(#t)"/>
    <!-- Under a group opacity and a clip, they go with the path. -->
    <g opacity=".5"><path d="M15 190 H95" marker-end="url(#d)" marker-start="url(#d)"/></g>
    <polyline points="110,190 150,170 190,190" marker-mid="url(#t)" transform="translate(0 -5)"/>
  </g>
</svg>
