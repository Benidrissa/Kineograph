<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <!-- pathLength rescales how dashes and offsets are measured, not the shape. -->
  <g fill="none" stroke-width="6">
    <path d="M10 20 H190" pathLength="100" stroke="#cc3333" stroke-dasharray="10 10"/>
    <path d="M10 40 H190" pathLength="1" stroke="#33aa33" stroke-dasharray="0.25 0.25" stroke-dashoffset="0.1"/>
    <circle cx="50" cy="100" r="35" pathLength="100" stroke="#3366cc" stroke-dasharray="25"/>
    <rect x="110" y="65" width="70" height="70" pathLength="8" stroke="#cc9900" stroke-dasharray="1"/>
    <line x1="10" y1="160" x2="190" y2="160" pathLength="9" stroke="#990099" stroke-dasharray="1"/>
    <polyline points="10,190 100,170 190,190" pathLength="20" stroke="#00aaaa" stroke-dasharray="1 1"/>
  </g>
</svg>
