<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <clipPath id="c"><circle cx="50" cy="50" r="10"><animate attributeName="r" from="10" to="45" dur="2s" fill="freeze"/></circle></clipPath>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><rect x="100" y="0" width="100" height="100" fill="#000000"><animate attributeName="fill" from="#000000" to="#ffffff" dur="2s" fill="freeze"/></rect></mask>
    <pattern id="p" patternUnits="userSpaceOnUse" width="20" height="20"><animate attributeName="width" from="20" to="40" dur="2s" fill="freeze"/><circle cx="10" cy="10" r="5" fill="#33aa33"><animate attributeName="r" from="2" to="9" dur="2s" fill="freeze"/></circle></pattern>
    <marker id="k" markerWidth="10" markerHeight="10" refX="5" refY="5"><circle cx="5" cy="5" r="2" fill="#990099"><animate attributeName="r" from="1" to="5" dur="2s" fill="freeze"/></circle></marker>
  </defs>
  <rect width="100" height="100" fill="#cc3333" clip-path="url(#c)"/>
  <rect x="100" y="0" width="100" height="100" fill="#3366cc" mask="url(#m)"/>
  <rect x="10" y="110" width="80" height="80" fill="url(#p)"/>
  <path d="M110 150 H180" stroke="#000000" stroke-width="2" marker-end="url(#k)" marker-start="url(#k)"/>
</svg>
