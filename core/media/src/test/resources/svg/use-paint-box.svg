<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="g"><stop offset="0" stop-color="#ff0000"/><stop offset="1" stop-color="#0000ff"/></linearGradient>
    <clipPath id="c" clipPathUnits="objectBoundingBox"><circle cx=".5" cy=".5" r=".5"/></clipPath>
    <mask id="m" maskContentUnits="objectBoundingBox"><circle cx=".5" cy=".5" r=".4" fill="#ffffff"/></mask>
    <rect id="a" width="40" height="40" fill="url(#g)"/>
    <rect id="b" width="40" height="40"/>
    <g id="gg"><rect width="20" height="40" fill="#33aa33"/><rect x="20" width="20" height="40" fill="#cc9900"/></g>
  </defs>
  <!-- x and y move the box along, so box units come out the same. -->
  <use href="#a" x="10" y="10"/>
  <use href="#a" x="60" y="10" transform="scale(1.5 1)"/>
  <use href="#b" x="150" y="10" fill="url(#g)"/>
  <use href="#gg" x="10" y="60" clip-path="url(#c)"/>
  <use href="#gg" x="60" y="60" mask="url(#m)"/>
  <use href="#gg" x="110" y="60" opacity=".5"/>
  <!-- A use's x and y are part of its transform, so a clip on it is measured after them. -->
  <clipPath id="u"><rect x="10" y="10" width="30" height="20"/></clipPath>
  <use href="#gg" x="0" y="100" clip-path="url(#u)"/>
  <g transform="translate(50 110) rotate(10)"><use href="#a" x="10" y="0"/></g>
</svg>
