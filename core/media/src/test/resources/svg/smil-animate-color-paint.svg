<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <defs><linearGradient id="g"><stop offset="0" stop-color="#ff0000"/><stop offset="1" stop-color="#0000ff"/></linearGradient></defs>
  <!-- A paint that is not a colour cannot be mixed, so it changes in one step halfway. -->
  <rect x="10" y="10" width="80" height="50" fill="#00ff00"><animate attributeName="fill" from="#00ff00" to="url(#g)" dur="2s" fill="freeze"/></rect>
  <rect x="110" y="10" width="80" height="50" fill="url(#g)"><animate attributeName="fill" from="url(#g)" to="none" dur="2s" fill="freeze"/></rect>
  <rect x="10" y="70" width="80" height="50" fill="#ffcc66" stroke="#000000" stroke-width="5"><animate attributeName="stroke" from="none" to="#cc3333" dur="2s" fill="freeze"/></rect>
  <rect x="110" y="70" width="80" height="50" fill="#ffcc66"><animate attributeName="fill" values="url(#g);#00ff00;url(#g)" dur="2s"/></rect>
</svg>
