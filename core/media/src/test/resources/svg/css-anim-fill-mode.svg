<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <style>
    @keyframes mv { from { transform: translateX(50px) } to { transform: translateX(150px) } }
    rect { animation: mv 1s linear 1s; transform: translateX(10px) }
    .none { animation-fill-mode: none }
    .fw { animation-fill-mode: forwards }
    .bw { animation-fill-mode: backwards }
    .both { animation-fill-mode: both }
    .auto { animation-fill-mode: auto }
  </style>
  <rect class="none" y="10" width="20" height="20" fill="#cc3333"/>
  <rect class="fw" y="40" width="20" height="20" fill="#3366cc"/>
  <rect class="bw" y="70" width="20" height="20" fill="#33aa33"/>
  <rect class="both" y="100" width="20" height="20" fill="#cc9900"/>
  <rect class="auto" y="130" width="20" height="20" fill="#990099"/>
</svg>
