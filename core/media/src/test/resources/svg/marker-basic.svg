<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4"><circle cx="4" cy="4" r="3" fill="#cc3333"/></marker>
    <marker id="sq" markerWidth="6" markerHeight="6" refX="3" refY="3"><rect width="6" height="6" fill="#3366cc"/></marker>
    <marker id="tri" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#33aa33"/></marker>
  </defs>
  <path d="M20 30 L80 30 L80 80" fill="none" stroke="#000000" marker-start="url(#dot)" marker-mid="url(#sq)" marker-end="url(#tri)" stroke-width="2"/>
  <polyline points="110,30 150,30 150,60 190,60" fill="none" stroke="#000000" stroke-width="2" marker-mid="url(#tri)"/>
  <line x1="110" y1="80" x2="190" y2="100" stroke="#000000" stroke-width="2" marker-end="url(#tri)" marker-start="url(#dot)"/>
  <polygon points="30,110 90,110 60,170" fill="#eeeeee" stroke="#000000" stroke-width="2" marker-start="url(#dot)" marker-mid="url(#tri)" marker-end="url(#sq)"/>
  <!-- Set through the property that covers all three, and inherited from a group. -->
  <g style="marker: url(#dot)" fill="none" stroke="#555555"><path d="M110 120 L150 120 L190 150" stroke-width="2"/></g>
  <!-- Only paths and basic line shapes get markers. -->
  <rect x="110" y="160" width="30" height="30" marker-start="url(#dot)" fill="#ffcc66"/>
</svg>
