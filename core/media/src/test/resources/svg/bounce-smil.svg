<?xml version="1.0" encoding="UTF-8"?>
<!-- A ball falling and rising, written for these tests. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100" height="100" viewBox="0 0 100 100">
  <title>Bounce</title>
  <desc>A red ball on a grey floor.</desc>
  <rect x="0" y="90" width="100" height="10" fill="#888888"/>
  <ellipse id="shadow" cx="50" cy="92" rx="10" ry="2" fill="#000000" fill-opacity="0.3">
    <animate attributeName="rx" values="4;10;4" keyTimes="0;0.5;1" calcMode="spline"
             keySplines="0.5 0 1 1;0 0 0.5 1" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  <circle id="ball" cx="50" cy="20" r="10" fill="#ff0000">
    <animate attributeName="cy" values="20;80;20" keyTimes="0;0.5;1" calcMode="spline"
             keySplines="0.5 0 1 1;0 0 0.5 1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
