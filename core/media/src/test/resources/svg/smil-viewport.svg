<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#eeeeee"/>
  <svg x="10" y="10" width="80" height="80" viewBox="0 0 20 20"><animate attributeName="viewBox" from="0 0 20 20" to="5 5 10 10" dur="2s" fill="freeze"/><rect width="20" height="20" fill="#cc3333"/><circle cx="10" cy="10" r="4" fill="#ffffff"/></svg>
  <svg x="110" y="10" width="40" height="40"><animate attributeName="width" from="40" to="80" dur="2s" fill="freeze"/><rect width="100" height="100" fill="#3366cc"/></svg>
  <svg y="110" width="80" height="80"><animate attributeName="x" from="10" to="50" dur="2s" fill="freeze"/><rect width="100" height="100" fill="#33aa33"/></svg>
</svg>
