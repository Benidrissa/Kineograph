<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="fade"><stop offset="0" stop-color="#000000"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <mask id="g" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="url(#fade)"/></mask>
    <mask id="inner" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><rect x="110" y="0" width="30" height="200" fill="#ffffff"/></mask>
    <!-- A mask on the content of a mask, and a mask on the mask itself. -->
    <mask id="nested" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><rect x="100" y="10" width="100" height="40" fill="#ffffff" mask="url(#inner)"/></mask>
    <mask id="self" mask="url(#inner)" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><rect x="100" y="60" width="100" height="40" fill="#ffffff"/></mask>
    <clipPath id="c"><circle cx="50" cy="150" r="40"/></clipPath>
  </defs>
  <rect x="10" y="10" width="80" height="80" fill="#cc3333" mask="url(#g)"/>
  <rect x="100" y="0" width="100" height="50" fill="#3366cc" mask="url(#nested)"/>
  <rect x="100" y="50" width="100" height="50" fill="#33aa33" mask="url(#self)"/>
  <!-- Mask and clip and opacity all at once. -->
  <rect x="0" y="100" width="100" height="100" fill="#cc9900" mask="url(#g)" clip-path="url(#c)" opacity=".75"/>
  <g mask="url(#g)" transform="translate(110 110)"><circle cx="20" cy="40" r="20" fill="#990099"/><circle cx="60" cy="40" r="20" fill="#00aaaa"/></g>
</svg>
