<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <rect x="50" y="10" width="20" height="20" fill="#cc3333"><animate attributeName="x" from="0" to="100" dur="2s" additive="sum" fill="freeze"/></rect>
  <rect x="50" y="40" width="20" height="20" fill="#3366cc"><animate attributeName="x" from="0" to="100" dur="2s" additive="replace" fill="freeze"/></rect>
  <!-- Stacked: the later starter sits on top; sum builds on what is below. -->
  <rect x="10" y="70" width="20" height="20" fill="#33aa33"><animate attributeName="x" from="10" to="60" dur="2s" fill="freeze"/><animate attributeName="x" from="0" to="100" dur="2s" additive="sum" fill="freeze"/></rect>
  <rect x="10" y="100" width="20" height="20" fill="#cc9900"><animate attributeName="x" from="0" to="100" dur="2s" additive="sum" begin="1s" fill="freeze"/><animate attributeName="x" from="10" to="60" dur="2s" fill="freeze"/></rect>
  <rect x="10" y="130" width="20" height="20" fill="#990099"><animate attributeName="x" from="10" to="60" dur="2s" begin="1s" fill="freeze"/><animate attributeName="x" from="100" to="170" dur="2s"/></rect>
  <rect x="10" y="160" width="20" height="20" fill="#800000"><animate attributeName="fill" from="#000000" to="#00ff00" dur="2s" additive="sum" fill="freeze"/></rect>
  <circle cx="150" cy="170" r="10" fill="#555555"><animate attributeName="r" from="0" to="10" dur="2s" additive="sum" fill="freeze"/><animate attributeName="cy" to="130" dur="2s" additive="sum" fill="freeze"/></circle>
</svg>
