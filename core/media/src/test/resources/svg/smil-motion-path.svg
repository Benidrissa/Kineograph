<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <path d="M20 100 C50 10 150 10 180 100 S100 190 20 100" fill="none" stroke="#cccccc"/>
  <circle r="8" fill="#cc3333"><animateMotion path="M20 100 C50 10 150 10 180 100 S100 190 20 100" dur="2s" fill="freeze"/></circle>
  <!-- Motion adds to the transform and position the element already has. -->
  <rect x="-5" y="-5" width="10" height="10" fill="#3366cc" transform="translate(0 40)"><animateMotion path="M10 10 H180" dur="2s" fill="freeze"/></rect>
  <rect x="10" y="150" width="10" height="10" fill="#33aa33"><animateMotion path="M0 0 L50 0 L50 30 L170 30" dur="2s" fill="freeze"/></rect>
  <g transform="scale(.5)"><circle r="8" cx="20" cy="360" fill="#cc9900"><animateMotion path="M0 0 h300" dur="2s" fill="freeze"/></circle></g>
  <rect width="10" height="10" fill="#990099"><animateMotion path="M180 10 V190" dur="2s"/></rect>
</svg>
