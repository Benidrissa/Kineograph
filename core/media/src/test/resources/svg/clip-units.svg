<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <clipPath id="box" clipPathUnits="objectBoundingBox"><circle cx=".5" cy=".5" r=".5"/></clipPath>
    <clipPath id="box2" clipPathUnits="objectBoundingBox"><rect x=".25" y=".25" width=".5" height=".5" transform="rotate(10 .5 .5)"/></clipPath>
    <clipPath id="user" clipPathUnits="userSpaceOnUse"><circle cx="50" cy="150" r="40"/></clipPath>
  </defs>
  <!-- A clip in box units stretches to each element. -->
  <rect x="10" y="10" width="80" height="40" fill="#cc3333" clip-path="url(#box)"/>
  <rect x="110" y="10" width="40" height="80" fill="#3366cc" clip-path="url(#box)"/>
  <rect x="10" y="60" width="80" height="40" fill="#33aa33" clip-path="url(#box2)"/>
  <g transform="translate(110 110)" clip-path="url(#box)"><circle cx="20" cy="20" r="20" fill="#cc9900"/><circle cx="60" cy="60" r="20" fill="#990099"/></g>
  <rect x="0" y="100" width="100" height="100" fill="#00aaaa" clip-path="url(#user)"/>
</svg>
