<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <!-- The one that started last is on top. Two that start together: the later in the file. -->
  <rect x="10" y="10" width="20" height="20" fill="#cc3333"><animate attributeName="x" from="10" to="60" dur="3s" fill="freeze"/><animate attributeName="x" from="100" to="170" dur="1s" begin="1s"/></rect>
  <rect x="10" y="40" width="20" height="20" fill="#3366cc"><animate attributeName="x" from="100" to="170" dur="1s" begin="1s"/><animate attributeName="x" from="10" to="60" dur="3s" fill="freeze"/></rect>
  <rect x="10" y="70" width="20" height="20" fill="#33aa33"><animate attributeName="x" from="10" to="60" dur="3s" begin="0s"/><animate attributeName="x" from="100" to="170" dur="3s" begin="0s"/></rect>
  <!-- A syncbase dependant comes after what it depends on, even if written before. -->
  <rect x="10" y="100" width="20" height="20" fill="#cc9900"><animate attributeName="x" from="100" to="170" begin="dep.begin" dur="3s"/><animate id="dep" attributeName="x" from="10" to="60" begin="0s" dur="3s"/></rect>
  <!-- A frozen one is still underneath what starts later. -->
  <rect x="10" y="130" width="20" height="20" fill="#990099"><animate attributeName="x" from="10" to="60" dur="1s" fill="freeze"/><animate attributeName="x" by="50" dur="1s" begin="1s" additive="sum"/></rect>
  <!-- A set in the middle of a stack. -->
  <rect x="10" y="160" width="20" height="20" fill="#00aaaa"><animate attributeName="x" from="10" to="170" dur="3s"/><set attributeName="x" to="100" begin="1s" dur="1s"/></rect>
</svg>
