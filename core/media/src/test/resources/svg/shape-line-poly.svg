<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <line x1="10" y1="10" x2="90" y2="50" stroke="#cc3333" stroke-width="5"/>
  <line x1="110" y1="10" x2="190" y2="50" stroke="#3366cc" stroke-width="5" stroke-linecap="round"/>
  <!-- A line has no fill, even if asked for one. -->
  <line x1="10" y1="60" x2="90" y2="60" fill="#00ff00"/>
  <polyline points="10,70 40,110 70,70 100,110" fill="#ffcc66" stroke="#663300" stroke-width="3"/>
  <polyline points="110 70, 140 110 , 170,70 190 110" fill="none" stroke="#006600" stroke-width="3"/>
  <polygon points="10,120 60,120 80,160 30,180" fill="#99ccff" stroke="#003366" stroke-width="3"/>
  <!-- An odd number of coordinates loses the last one. -->
  <polygon points="100,120 150,120 170,160 120,180 110" fill="#ffccff" stroke="#660066" stroke-width="3"/>
  <polyline points="175,120 195,120 195 nope 175,180" fill="none" stroke="#000000" stroke-width="3"/>
</svg>
