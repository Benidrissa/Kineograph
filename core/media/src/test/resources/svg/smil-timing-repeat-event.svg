<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <!-- repeat(1) comes from an event in Chromium, and events only fire while it plays, not when seeking, which is how references are made. -->
  <rect x="10" y="20" width="30" height="30" fill="#cc9900"><animate id="s1" attributeName="x" from="10" to="160" dur="1s" repeatCount="2"/><animate attributeName="fill" to="#00ff00" begin="s1.repeat(1)" dur="0.5s"/></rect>
</svg>
