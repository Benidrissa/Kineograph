<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" x2="200" y1="0" y2="0"><stop offset="0" stop-color="#ff0000"/><stop offset="1" stop-color="#0000ff"/></linearGradient>
    <pattern id="p" patternUnits="userSpaceOnUse" width="6" height="6"><rect width="3" height="6" fill="#33aa33"/></pattern>
    <text id="u" font-size="30" font-family="sans-serif" x="110" y="30">Use</text>
    <clipPath id="c"><use href="#u" y="100"/></clipPath>
  </defs>
  <text x="10" y="30" font-size="30" font-family="sans-serif" fill="url(#g)">User</text>
  <use href="#u" fill="#cc3333"/>
  <text x="10" y="70" font-size="30" font-family="sans-serif" font-weight="bold" fill="url(#p)">Pat</text>
  <text x="110" y="70" font-size="30" font-family="sans-serif" stroke="#000000" stroke-width="2" fill="#ffcc66" paint-order="stroke">Ord</text>
  <rect x="100" y="100" width="100" height="40" fill="#3366cc" clip-path="url(#c)"/>
  <text x="10" y="130" font-size="20" font-family="sans-serif" stroke="#000000" stroke-dasharray="2 2" fill="none">Dash</text>
  <text x="10" y="170" font-size="20" font-family="sans-serif" transform="scale(1 1.5) translate(0 -50)" fill="#990099">Tall</text>
  <text x="110" y="170" font-size="20" font-family="sans-serif" fill="#00aaaa" fill-opacity=".5" stroke="#000000" stroke-opacity=".5">Half</text>
  <svg x="10" y="175" width="60" height="15"><text y="14" font-size="20" font-family="sans-serif">Clipped</text></svg>
</svg>
