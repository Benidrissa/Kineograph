<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <!-- By default the region is the box grown by 10% on each side, and the content is in user space. -->
    <mask id="dflt"><rect x="0" y="0" width="200" height="200" fill="#ffffff"/></mask>
    <mask id="box" x=".25" y=".25" width=".5" height=".5"><rect x="0" y="0" width="200" height="200" fill="#ffffff"/></mask>
    <mask id="pct" x="0%" y="0%" width="100%" height="50%"><rect x="0" y="0" width="200" height="200" fill="#ffffff"/></mask>
    <mask id="user" maskUnits="userSpaceOnUse" x="10" y="110" width="30" height="80"><rect x="0" y="0" width="200" height="200" fill="#ffffff"/></mask>
    <mask id="cont" maskContentUnits="objectBoundingBox"><circle cx=".5" cy=".5" r=".5" fill="#ffffff"/></mask>
    <mask id="both" maskContentUnits="objectBoundingBox" maskUnits="userSpaceOnUse" x="110" y="110" width="90" height="45"><rect width=".5" height="1" fill="#ffffff"/></mask>
  </defs>
  <rect x="10" y="10" width="50" height="50" fill="#cc3333" stroke="#000000" stroke-width="20" mask="url(#dflt)"/>
  <rect x="75" y="10" width="50" height="50" fill="#3366cc" mask="url(#box)"/>
  <rect x="140" y="10" width="50" height="50" fill="#33aa33" mask="url(#pct)"/>
  <rect x="0" y="100" width="100" height="100" fill="#cc9900" mask="url(#user)"/>
  <rect x="50" y="110" width="50" height="80" fill="#990099" mask="url(#cont)"/>
  <rect x="110" y="110" width="80" height="80" fill="#00aaaa" mask="url(#both)"/>
</svg>
