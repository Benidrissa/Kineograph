<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <!-- x, y, width, height and clipping of an inner viewport. -->
  <rect width="200" height="200" fill="#eeeeee"/>
  <svg x="10" y="10" width="80" height="80">
    <rect width="100%" height="100%" fill="#ffcccc"/>
    <circle cx="80" cy="80" r="30" fill="#cc3333"/>
  </svg>
  <svg x="110" y="10" width="80" height="80" overflow="visible">
    <rect width="100%" height="100%" fill="#ccccff"/>
    <circle cx="80" cy="80" r="15" fill="#3366cc"/>
  </svg>
  <svg x="10" y="110" width="40%" height="40%" viewBox="0 0 10 10">
    <rect width="10" height="10" fill="#ccffcc"/>
    <circle cx="5" cy="5" r="4" fill="#33aa33"/>
    <!-- Inside again, with percentages of this viewBox. -->
    <svg x="50%" y="50%" width="50%" height="50%"><rect width="100" height="100" fill="#000000" fill-opacity=".5"/></svg>
  </svg>
  <svg x="110" y="110" viewBox="0 0 10 10" width="80" height="40" preserveAspectRatio="xMidYMid slice">
    <rect width="10" height="5" fill="#cc9900"/>
    <rect y="5" width="10" height="5" fill="#990099"/>
  </svg>
  <!-- No width or height means 100% of the outer viewport. -->
  <svg x="110" y="160"><rect width="80" height="30" fill="#00aaaa"/></svg>
  <svg x="50" y="0" width="0" height="50"><rect width="50" height="50" fill="#000000"/></svg>
</svg>
