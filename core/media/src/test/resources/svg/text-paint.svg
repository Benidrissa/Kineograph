<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="g"><stop offset="0" stop-color="#ff0000"/><stop offset="1" stop-color="#0000ff"/></linearGradient>
    <clipPath id="c"><text x="10" y="150" font-size="50" font-family="sans-serif" font-weight="bold">Clip</text></clipPath>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><text x="110" y="150" font-size="40" font-family="sans-serif" fill="#ffffff">Ma</text></mask>
  </defs>
  <text x="10" y="40" font-size="36" font-family="sans-serif" fill="url(#g)">Grad</text>
  <text x="10" y="80" font-size="36" font-family="sans-serif" fill="none" stroke="url(#g)">Grad</text>
  <text x="110" y="80" font-size="30" font-family="sans-serif" opacity=".5"><tspan fill="#cc3333">Op</tspan><tspan fill="#3366cc" dx="-8">ac</tspan></text>
  <rect x="0" y="100" width="100" height="60" fill="#33aa33" clip-path="url(#c)"/>
  <rect x="100" y="100" width="100" height="60" fill="#cc9900" mask="url(#m)"/>
  <text x="10" y="190" font-size="20" font-family="sans-serif" text-decoration="underline" fill="#990099">Under</text>
  <text x="110" y="190" font-size="20" font-family="sans-serif" fill="#00aaaa" visibility="hidden">Hide<tspan visibility="visible" dx="-40">Vis</tspan></text>
</svg>
