<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <clipPath id="odd"><path clip-rule="evenodd" d="M10 10 H90 V90 H10 Z M30 30 H70 V70 H30 Z"/></clipPath>
    <clipPath id="non"><path d="M110 10 H190 V90 H110 Z M130 30 H170 V70 H130 Z"/></clipPath>
    <clipPath id="fillrule"><path fill-rule="evenodd" d="M10 110 H90 V190 H10 Z M30 130 H70 V170 H30 Z"/></clipPath>
    <clipPath id="inherit" clip-rule="evenodd"><path d="M110 110 H190 V190 H110 Z M130 130 H170 V170 H130 Z"/></clipPath>
  </defs>
  <rect width="100" height="100" fill="#cc3333" clip-path="url(#odd)"/>
  <rect x="100" width="100" height="100" fill="#3366cc" clip-path="url(#non)"/>
  <!-- fill-rule does nothing inside a clip. -->
  <rect y="100" width="100" height="100" fill="#33aa33" clip-path="url(#fillrule)"/>
  <rect x="100" y="100" width="100" height="100" fill="#cc9900" clip-path="url(#inherit)"/>
</svg>
