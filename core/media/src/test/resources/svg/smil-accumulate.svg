<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <rect x="10" y="10" width="20" height="20" fill="#cc3333"><animate attributeName="x" from="0" to="50" dur="1s" repeatCount="3" accumulate="sum" fill="freeze"/></rect>
  <rect x="10" y="40" width="20" height="20" fill="#3366cc"><animate attributeName="x" by="50" dur="1s" repeatCount="3" accumulate="sum" fill="freeze"/></rect>
  <rect x="10" y="70" width="20" height="20" fill="#33aa33"><animate attributeName="x" values="10;40;20" dur="1s" repeatCount="3" accumulate="sum" fill="freeze"/></rect>
  <rect x="10" y="100" width="20" height="20" fill="#cc9900"><animate attributeName="x" from="10" to="50" dur="1s" repeatCount="2.5" accumulate="sum" fill="freeze"/></rect>
  <rect x="10" y="130" width="20" height="20" fill="#000000"><animate attributeName="fill" from="#000000" to="#400000" dur="1s" repeatCount="3" accumulate="sum" fill="freeze"/></rect>
  <!-- Accumulating to-animations are not allowed to accumulate. -->
  <rect x="10" y="160" width="20" height="20" fill="#990099"><animate attributeName="x" to="50" dur="1s" repeatCount="3" accumulate="sum" fill="freeze"/></rect>
</svg>
