<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <rect x="10" y="10" width="20" height="20" fill="#cc3333"><animate attributeName="x" values="10;170;90" dur="2s" fill="freeze"/></rect>
  <rect x="10" y="40" width="20" height="20" fill="#3366cc"><animate attributeName="x" values="10;170;90" keyTimes="0;.25;1" dur="2s" fill="freeze"/></rect>
  <rect x="10" y="70" width="20" height="20" fill="#33aa33"><animate attributeName="x" values="10;170;90" keyTimes="0;.75;1" dur="2s" fill="freeze" calcMode="linear"/></rect>
  <!-- keyTimes that break the rules cancel the animation. -->
  <rect x="10" y="100" width="20" height="20" fill="#cc9900"><animate attributeName="x" values="10;170;90" keyTimes="0;1" dur="2s" fill="freeze"/></rect>
  <rect x="10" y="130" width="20" height="20" fill="#990099"><animate attributeName="x" values="10;170;90" keyTimes="0;.5;.9" dur="2s" fill="freeze"/></rect>
  <rect x="10" y="160" width="20" height="20" fill="#00aaaa"><animate attributeName="x" values="10;170;90" keyTimes=".1;.5;1" dur="2s" fill="freeze"/></rect>
</svg>
