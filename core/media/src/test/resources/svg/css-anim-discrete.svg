<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <style>
    @keyframes vis { from { visibility: visible } to { visibility: hidden } }
    @keyframes dis { from { display: inline } to { display: none } }
    @keyframes cap { from { stroke-linecap: butt } to { stroke-linecap: round } }
    @keyframes rule { from { fill-rule: nonzero } to { fill-rule: evenodd } }
    @keyframes pe { 0%, 49% { fill: none } 50%, 100% { fill: #00aaaa } }
    .a { animation: vis 2s linear forwards }
    .b { animation: dis 2s linear forwards }
    .c { animation: cap 2s linear forwards }
    .d { animation: rule 2s linear forwards }
    .e { animation: pe 2s linear forwards; stroke: #000000 }
  </style>
  <rect class="a" x="10" y="10" width="40" height="40" fill="#cc3333"/>
  <rect class="b" x="70" y="10" width="40" height="40" fill="#3366cc"/>
  <line class="c" x1="140" y1="30" x2="180" y2="30" stroke="#33aa33" stroke-width="16"/>
  <path class="d" d="M10 70 h60 v60 h-60 z M25 85 h30 v30 h-30 z" fill="#cc9900"/>
  <rect class="e" x="100" y="70" width="60" height="60"/>
</svg>
