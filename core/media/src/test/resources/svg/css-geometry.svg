<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <style>
    .a { x: 10px; y: 10px; width: 50px; height: 30px; rx: 8px; fill: #cc3333 }
    .b { cx: 120px; cy: 25px; r: 15px; fill: #3366cc }
    .c { cx: 50px; cy: 80px; rx: 40px; ry: 15px; fill: #33aa33 }
    .d { d: path("M110 60 h40 l20 40 h-60 z"); fill: #cc9900 }
    .e { width: 40%; height: 10%; x: 5%; y: 60%; fill: #990099 }
  </style>
  <rect class="a"/>
  <!-- CSS beats the attribute. -->
  <circle class="b" cx="180" cy="180" r="50"/>
  <ellipse class="c"/>
  <path class="d" d="M0 0 h200 v200 h-200 z"/>
  <rect class="e" x="100" y="100" width="100" height="100"/>
</svg>
